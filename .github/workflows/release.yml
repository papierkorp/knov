name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make install-tools

      - run: make prod

      - name: prepare release notes
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release_notes.md
          else
            cp README.md release_notes.md
          fi

      - run: gh release create ${{ github.ref_name }} bin/knov bin/knov.exe bin/knov-arm64 --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  release-android:
    runs-on: ubuntu-latest
    needs: release
    # builds inside tools/docker_android/Dockerfile's image instead of installing an Android
    # SDK directly on the runner - that image pins platform/build-tools versions, so CI and
    # a contributor's `make docker-build-apk` can't silently drift onto different SDK
    # versions. runs as its own job, after the main release, so a toolchain hiccup here can't
    # block the main release (needs: release only gates the order, not the outcome) - but a
    # failure here still fails this job loudly rather than being swallowed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: make docker-build-apk

      - run: gh release upload ${{ github.ref_name }} "android/app/build/outputs/apk/debug/app-debug.apk#knov-android.apk"
        env:
          GH_TOKEN: ${{ github.token }}
