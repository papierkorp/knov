name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go install github.com/swaggo/swag/cmd/swag@latest
      - run: go install golang.org/x/text/cmd/gotext@latest

      - run: make prod

      - name: build release notes from changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            cat docs/changelogs/*.md > release_notes.md
          else
            git diff "$PREV_TAG" -- docs/changelogs/ | grep -E '^\+[^+]' | sed 's/^+//' > release_notes.md
          fi

      - run: gh release create ${{ github.ref_name }} bin/knov bin/knov.exe --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
