name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go install github.com/swaggo/swag/cmd/swag@latest
      - run: go install golang.org/x/text/cmd/gotext@latest

      - run: make prod
      - run: make mobile

      - name: prepare release notes
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release_notes.md
          else
            cp README.md release_notes.md
          fi

      - run: gh release create ${{ github.ref_name }} bin/knov bin/knov.exe bin/knov-arm64 --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
