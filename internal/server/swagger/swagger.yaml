  /api/kanban/sync:
    post:
      description: |-
        Starts the file-sync job (the same one the scheduler runs periodically) in the
        background, so files moved or edited outside the app are picked up before
        dragging their cards; poll the returned job id via GET /api/jobs/{id} for
        completion. Its dedup lock already rejects a second concurrent run outright, so
        repeated presses just report "already running" instead of queuing up.
