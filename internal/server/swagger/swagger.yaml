  /api/logs/file:
    get:
      description: Parses per-key log file(s) into structured entries, merges + time-sorts
        them and renders a table (default), a summary (view=summary) or monospace
        lines (raw=true). name picks one key's file (e.g. file-sync.log), name=all
        merges every key's log, omitted uses app.log. from/to (unix seconds) filter
        server-side - the range reaches entries older than a plain load returns.
      parameters:
      - description: log file name, or 'all' to merge every key's log
        in: query
        name: name
        type: string
      - description: only entries at/after this unix-seconds time
        in: query
        name: from
        type: integer
      - description: only entries at/before this unix-seconds time
        in: query
        name: to
        type: integer
      - description: reconstructed monospace line view instead of the table
        in: query
        name: raw
        type: boolean
      - description: '''summary'' for a compact time+level+message view with a lower
          default limit'
        in: query
        name: view
        type: string
      - description: max entries to return (table default 5000, or 50000 with from/to,
          or 20 for view=summary)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: log HTML
          schema:
            type: string
        "404":
          description: file logging not enabled
          schema:
            type: string
