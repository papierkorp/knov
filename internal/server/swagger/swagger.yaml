  /api/jobs/{id}:
    delete:
      description: |-
        Requests cancellation of a running async job (a delete-folder, bulk-delete or
        metadata-full-rebuild run) by canceling its context. Cancellation is cooperative - the
        job only stops at its next checkpoint, so the response still reflects "running";
        poll GET /api/jobs/{id} for the eventual "canceled" status. Only job types the
        jobs UI shows a cancel button for actually honor it - see job.IsCancellable.
      parameters:
      - description: Job id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobStorage.JobRecord'
        "404":
          description: job not running
          schema:
            type: string
      summary: Cancel a running async job
      tags:
      - jobs
    get:
      description: |-
        Polled by htmx while an async job (started via a delete-folder or bulk-delete
        request) runs in the background; returns a small status fragment - a
        self-polling spinner while running, empty once done, or an inline error message.
      parameters:
      - description: Job id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobStorage.JobRecord'
        "404":
          description: job not found
          schema:
            type: string
      summary: Get async job status
      tags:
      - jobs
