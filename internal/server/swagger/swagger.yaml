      tags:
      - system
  /api/system/backups/{name}/download:
    get:
      description: Downloads a backup set's raw .tar.gz archive
      parameters:
      - description: Backup set name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/gzip
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download a backup
      tags:
      - system
  /api/system/backups/{name}/lock:
    delete:
      description: Removes a backup set's protection from automatic rotation
      parameters:
      - description: Backup set name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backup.LogEntry'
            type: array
      summary: Unlock a backup
      tags:
      - system
    post:
      description: Marks a backup set to never be deleted by automatic rotation, until
        unlocked
      parameters:
      - description: Backup set name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backup.LogEntry'
            type: array
      summary: Lock a backup
      tags:
      - system
  /api/system/backups/{name}/restore:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Takes a fresh safety snapshot, restores a backup set onto disk,
        then restarts the app to apply it. If the set includes docs/media and a git
        remote is configured, the restored state is also force-pushed to it, overwriting
        anything there this device hasn't seen - confirm is then required to acknowledge
        that. Runs in the background - poll GET /api/jobs/{id} (returned in the response
        body/fragment) for completion.
      parameters:
      - description: Backup set name
        in: path
        name: name
        required: true
        type: string
      - description: Required (true) when the set includes docs/media and a git remote
          is configured, acknowledging the restored state will be force-pushed to
          it
        in: formData
        name: confirm
        type: boolean
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobStorage.JobRecord'
      summary: Restore a backup
      tags:
      - system
  /api/system/cache:
    delete:
      consumes:
      - application/x-www-form-urlencoded
      description: Removes all cache entries, forcing a rebuild on next access
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: cache invalidated
          schema:
            type: string
        "500":
          description: failed to invalidate cache
          schema:
            type: string
      summary: Invalidate cache
      tags:
      - system
  /api/system/changelog:
    get:
      description: Returns the rendered changelog history as HTML (for HTMX) - the
        same content shown on the /system/changelog page, for embedding in the rail
        "changelog" panel
      produces:
      - text/html
      responses:
        "200":
          description: changelog HTML
          schema:
            type: string
      summary: Get changelog
      tags:
      - system
  /api/system/environment:
    get:
      description: 'Returns every recognized KNOV_* environment variable with description,
        default and current value (sensitive values redacted) as JSON, a full HTML
        table (for HTMX, the same content shown on the /system/environment page),
        or - with view=summary - a compact "KEY: value" list (for the admin panel''s
        environment section)'
      parameters:
      - description: 'html view: full table (default) or ''summary'' for a compact
          key/value list'
        in: query
        name: view
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/render.EnvVarInfo'
            type: array
      summary: Get environment variables
      tags:
      - system
  /api/system/jobs:
    get:
      description: Returns recent job runs as HTML table (for HTMX) or JSON
      parameters:
      - description: 'sort column: job, started, finished, duration, status'
        in: query
        name: sort
        type: string
      - description: 'sort direction: asc (default) or desc'
        in: query
        name: dir
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/job.JobRun'
            type: array
      summary: Get job history
      tags:
      - system
  /api/system/release:
    get:
      description: Returns the rendered version info and release notes as HTML (for
        HTMX) - the same content shown on the /system/release page, for embedding
        in the rail "release" panel
      produces:
      - text/html
      responses:
        "200":
          description: release HTML
          schema:
            type: string
      summary: Get release notes
      tags:
      - system
  /api/system/restart:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Restarts the application in place (same PID on Linux/macOS, so
        it keeps working under a supervisor like systemd) and standalone otherwise
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: restarting
          schema:
            type: string
      summary: Restart application
      tags:
      - system
  /api/system/version:
    get:
      description: Returns the version/build-info table as HTML (for HTMX) or JSON
        - the same content shown on the /system/version page, for embedding in the
        rail "version" panel
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/render.VersionInfo'
      summary: Get version/build info
      tags:
      - system
  /api/testdata/clean:
    post:
      description: Removes all test data files and metadata
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: '{"status":"ok","message":"test data cleaned"}'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Clean test data
      tags:
      - testdata
  /api/testdata/setup:
    post:
      description: Creates test files, git operations, and metadata for testing
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: '{"status":"ok","message":"test data setup completed"}'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Setup test data
      tags:
      - testdata
  /api/themes:
    get:
      description: Get current theme and available themes
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: '{"current":"themename","available":["theme1","theme2"]}'
          schema:
            type: string
      summary: Get themes
      tags:
      - themes
  /api/themes/:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Set new theme via form parameter
      parameters:
      - description: Theme name to set
        in: formData
        name: theme
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "303":
          description: Redirect to settings page
      summary: Set theme
      tags:
      - themes
  /api/themes/{themeName}/settings:
    get:
      description: Get all settings for a specific theme
      parameters:
      - description: Theme name
        in: path
        name: themeName
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: Theme settings object
          schema:
            type: object
      summary: Get theme settings
      tags:
      - themes
  /api/themes/{themeName}/settings/{settingKey}:
    put:
      consumes:
      - application/x-www-form-urlencoded
      description: Update a specific setting for a theme
      parameters:
      - description: Theme name
        in: path
        name: themeName
        required: true
        type: string
      - description: Setting key to update
        in: path
        name: settingKey
        required: true
        type: string
      - description: Setting value
        in: formData
        name: value
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: Setting updated successfully
      summary: Update theme setting
      tags:
      - themes
  /api/themes/settings:
    get:
      description: Get all theme settings as HTML form elements
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: HTML form elements
          schema:
            type: string
      summary: Get theme settings form
      tags:
      - themes
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Update a specific setting for the current theme
      parameters:
      - description: Setting key
        in: formData
        name: key
        required: true
        type: string
      - description: Setting value
        in: formData
        name: value
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: Setting updated successfully
      summary: Update theme setting
      tags:
      - themes
  /api/trackers/add-counter:
    post:
      description: Return HTML for a new empty tracker counter name input
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: tracker counter row html
          schema:
            type: string
      summary: Add tracker counter row
      tags:
      - tracker
  /api/trackers/delete/{id}:
    delete:
      description: Delete a tracker from config storage and its paired file
      parameters:
      - description: tracker id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: empty body; sets HX-Redirect to /
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete tracker
      tags:
      - tracker
  /api/trackers/reset:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Zero a counter's recorded days back to 0, save, and return the
        updated counter row
      parameters:
      - description: Tracker identifier (name)
        in: formData
        name: trackerid
        required: true
        type: string
      - description: Counter id
        in: formData
        name: counterid
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: updated tracker counter row html
          schema:
            type: string
      summary: Reset a tracker counter
      tags:
      - tracker
  /api/trackers/save:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Save a tracker's title and reconcile its counters by id (removed
        counters lose their recorded counts); regenerates the paired markdown table
      parameters:
      - description: Tracker identifier (name)
        in: formData
        name: trackerid
        required: true
        type: string
      - description: Optional heading
        in: formData
        name: title
        type: string
      - description: Counter ids (blank for a new counter), index-aligned with counter_title[]
        in: formData
        name: counter_id[]
        type: array
      - description: Counter titles, index-aligned with counter_id[]
        in: formData
        name: counter_title[]
        type: array
      - description: Per-counter ColumnSet as JSON, index-aligned with counter_id[]
        in: formData
        name: counter_columns[]
        type: array
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: empty body; sets HX-Redirect to the tracker's edit page
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save tracker configuration
      tags:
      - tracker
  /api/trackers/tick:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Add +1/-1 to a counter's day bucket, save, and return the updated
        counters-view row
      parameters:
      - description: Tracker identifier (name)
        in: formData
        name: trackerid
        required: true
        type: string
      - description: Counter id
        in: formData
        name: counterid
        required: true
        type: string
      - description: 'Change: 1 or -1'
        in: formData
        name: delta
        required: true
        type: integer
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: updated tracker counter row html
          schema:
            type: string
      summary: Record a tracker change
      tags:
      - tracker
swagger: "2.0"
